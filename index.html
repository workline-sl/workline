.vh{position:absolute;width:1px;height:1px;opacity:0}.bt{display:inline-flex;align-items:center;margin:8px 0 0;cursor:pointer;position:relative;font-size:13px}

.gv{display:flex;gap:10px;flex-wrap:wrap}.th{position:relative;width:80px;height:80px}.th img{width:100%;height:100%;object-fit:cover;border-radius:16px}.th button{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;background:var(--tx);color:var(--bg)}

.bar{height:10px;border-radius:5px;background:var(--line);margin:8px 0}.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5B5BFF,#FF4FD8)}

body.lock{overflow:hidden}
.tag.bst{background:linear-gradient(135deg,#FFE8A3,#FFD3EC);color:#7A4B00}

.shgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.top{padding:2px 4px 6px}

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

  for (const [k, id] of TX.names) {

      const code = refCode(S.me.id), n = new Set(S.workers.filter(x => x.referred_by === code && x.owner_id !== S.me.id).map(x => x.owner_id)).size;
      if (n < CFG.REFERRAL_TARGET) throw new Error('not-enough');

      if (!acc[ph]) throw new Error('no-such-user');
      acc[ph] = await pwHash(ph, a.p_password); try { localStorage.setItem('workline.accounts', JSON.stringify(acc)); } catch (e) { }

    }
    if (name === 'delete_my_account') {
      const me = S.me.id, myW = S.workers.filter(x => x.owner_id === me).map(x => x.id), myJ = S.jobs.filter(x => x.owner_id === me).map(x => x.id);
      S.workers = S.workers.filter(x => x.owner_id !== me); S.jobs = S.jobs.filter(x => x.owner_id !== me);
      S.applications = S.applications.filter(x => x.applicant_id !== me && !myJ.includes(x.job_id));

      S.notifications = S.notifications.filter(x => x.user_id !== me);

      try { const acc = LocalDB.auth._acc(); delete acc[S.me.phone]; localStorage.setItem('workline.accounts', JSON.stringify(acc)); } catch (e) { }
      S.me = null; persistLocal(); return true;
    }
    throw new Error('unknown-rpc:' + name);

};

const SB_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
const SB_CDN2 = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';
const loadScript = (src, ms) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; const to = setTimeout(() => { s.remove(); rej(new Error('script-timeout')); }, ms || 15000); s.onload = () => { clearTimeout(to); res(); }; s.onerror = () => { clearTimeout(to); s.remove(); rej(new Error('script-load')); }; document.head.appendChild(s); });
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error((label || 'timeout') + ': network timeout')), ms))]);
/* phone (+9477...) -> internal auth e-mail. Users never see it. */
const phoneEmail = e164 => String(e164).replace(/\D/g, '') + '@' + CFG.AUTH_EMAIL_DOMAIN;
async function pwHash(phone, pw) {
  const txt = 'workline:' + phone + ':' + pw;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0; return 'h' + (h >>> 0).toString(16); }
}
/* every table / bucket / function lives under a wl_ / wl- prefix so Workline can share a Supabase project with other apps */
const TBL = n => 'wl_' + n, BK = { media: 'wl-media', private: 'wl-private' };
const CloudDB = {
  mode: 'cloud', sb: null,
  async boot() {
    if (!window.supabase) { try { await loadScript(SB_CDN); } catch (e) { await loadScript(SB_CDN2); } }
    if (!window.supabase || !window.supabase.createClient) throw new Error('supabase-library-missing');
    let store; try { localStorage.setItem('wl_t', '1'); localStorage.removeItem('wl_t'); store = localStorage; } catch (e) { const m = {}; store = { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
    const safeFetch = (url, o) => { o = o || {}; let h = o.headers; try { if (h && typeof Headers !== 'undefined' && h instanceof Headers) { const x = {}; h.forEach((v, k) => x[k] = v); h = x; } } catch (e) { } return fetch(url, { ...o, headers: h }); };
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { global: { fetch: safeFetch }, auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storage: store, storageKey: 'workline-auth' } });
    /* everything that does not depend on each other runs at the same time */
    fetch(CFG.SUPABASE_URL + '/auth/v1/settings', { headers: { apikey: CFG.SUPABASE_ANON_KEY } }).then(r => r.ok ? r.json() : null).then(j => { if (j) S.authCfg = j; }).catch(() => { });
    const [, sess] = await Promise.all([withTimeout(this._settings(), 20000, 'database'), this.sb.auth.getSession()]);
    if (sess.error) S.authError = sess.error.message;
    const user = sess.data && sess.data.session ? sess.data.session.user : null;
    const [me] = await Promise.all([user ? this._me(user) : null, this.reload(PUBLIC_TABLES)]);
    S.me = me; saveCache();
    /* private data (my applications, payments, chats, notices…) loads in the background */
    this.loadPrivate();
    this.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; go(); } });
  },
  async _me(user) {
    const { data } = await this.sb.from(TBL('admins')).select('user_id').eq('user_id', user.id).maybeSingle();
    const md = user.user_metadata || {};
    let phone = md.phone || (user.phone ? '+' + String(user.phone).replace(/^\+/, '') : '');
    if (!phone && user.email) { const d = String(user.email).split('@')[0]; if (/^94\d{9}$/.test(d)) phone = '+' + d; }
    const ids = (user.identities || []).map(i => i.provider), prov = (user.app_metadata || {}).provider || '';
    const google = ids.includes('google') || prov === 'google', phoneAcc = /@/.test(user.email || '') && String(user.email).endsWith('@' + CFG.AUTH_EMAIL_DOMAIN);
    const pwSet = phoneAcc || !!md.pw_set;
    return { id: user.id, phone, isAdmin: !!data, email: phoneAcc ? '' : (user.email || ''), google, pwSet, needsSetup: !phoneAcc && (!phone || !pwSet) };
  },
  async _settings() {
    const { data, error } = await this.sb.from(TBL('settings')).select('key,value');
    if (error) throw new Error('database-not-ready: ' + error.message);
    (data || []).forEach(r => S.settings[r.key] = r.value);
  },
  loadPrivate() {
    this._priv = this.reload(PRIVATE_TABLES).then(() => {

    }).catch(() => { });

  },
  async reload(tables) {
    const lim = { workers: 1000, jobs: 1000, reviews: 3000, notifications: 100, audit_log: 100 };
    await Promise.all((tables || TABLES).map(async t => {
      let q = this.sb.from(TBL(t)).select('*');

  },
  async upsert(table, row) {
    /* existing rows are UPDATEd, new rows INSERTed — so row-level security can treat them differently */
    const exists = (S[table] || []).some(x => x.id === row.id);
    const send = r => (exists ? this.sb.from(TBL(table)).update(r).eq('id', r.id) : this.sb.from(TBL(table)).insert(r)).select().single();

  async remove(table, id) { const { error } = await this.sb.from(TBL(table)).delete().eq('id', id); if (error) throw error; S[table] = S[table].filter(x => x.id !== id); },
  async markAllRead() { const { error } = await this.sb.from(TBL('notifications')).update({ read: true }).eq('user_id', S.me.id).eq('read', false); if (error) throw error; S.notifications.forEach(n => { if (n.user_id === S.me.id) n.read = true; }); },
  async saveSetting(key, value) { const { error } = await this.sb.from(TBL('settings')).upsert({ key, value }); if (error) throw error; S.settings[key] = value; },
  async upload(bucket, dataUrl, name) {
    if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl;
    const path = S.me.id + '/' + (name || uid()) + '.jpg';
    const { error } = await this.sb.storage.from(BK[bucket]).upload(path, dataUrlToBlob(dataUrl), { contentType: 'image/jpeg', upsert: true });
    if (error) throw error;
    if (bucket === 'media') return this.sb.storage.from(BK.media).getPublicUrl(path).data.publicUrl;
    return 'private:' + path;
  },
  async signedUrl(p) {
    if (!p || !String(p).startsWith('private:')) return p;
    const { data, error } = await this.sb.storage.from(BK.private).createSignedUrl(p.slice(8), 3600);
    return error ? '' : data.signedUrl;
  },
  auth: {
    async register(phone, pw) {
      const { data, error } = await CloudDB.sb.auth.signUp({ email: phoneEmail(phone), password: pw, options: { data: { phone } } });
      if (error) throw error;
      if (data && data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error('already-registered');
      if (!data.session) {   /* "Confirm email" is still ON in Supabase — try signing in directly */
        const r = await CloudDB.sb.auth.signInWithPassword({ email: phoneEmail(phone), password: pw });
        if (r.error) throw new Error('confirm-email-on');
        return await CloudDB._me(r.data.user);
      }
      return await CloudDB._me(data.user);
    },
    async signIn(phone, pw) {
      const { data, error } = await CloudDB.sb.auth.signInWithPassword({ email: phoneEmail(phone), password: pw });
      if (error) throw error;
      return await CloudDB._me(data.user);
    },
    /* Google accounts that have set a password can also sign in with Gmail address + password */
    async signInEmail(email, pw) {
      const { data, error } = await CloudDB.sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      return await CloudDB._me(data.user);
    },
    async google(link) {

  },
  async loadMessages(threadId) {

  async sendMessage(m) { const { data, error } = await this.sb.from(TBL('messages')).insert(m).select().single(); if (error) throw error; return data; },

function readImage(file, maxPx) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('not-image'));
    if (file.size > CFG.LIMITS.maxImageBytes) return rej(new Error('too-big'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('read'));
    r.onload = () => {
      const i = new Image();
      i.onerror = () => rej(new Error('not-image'));
      i.onload = () => {   /* re-encoding through canvas also strips EXIF/GPS metadata */
        const k = Math.min(1, (maxPx || 640) / Math.max(i.width, i.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(i.width * k)); c.height = Math.max(1, Math.round(i.height * k));
        c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .8));
      };
      i.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

}
function pk(key, max, label) {

}
async function pup(key, max, inp) {
  const files = [...inp.files]; inp.value = '';
  for (const f of files) {
    try {
      const d = await readImage(f, 720);
      if (max === 1) PHT[key] = [d]; else if (PHT[key].length < max) PHT[key].push(d);

  if (/confirmation email|sending.*email|email rate limit|over_email_send_rate_limit|confirm-email-on|email.?not.?confirmed|not.?confirmed/i.test(m + ' ' + code)) {
    console.error('[Workline] Supabase → Authentication → Sign In / Providers → Email → turn OFF "Confirm email". Detail:', m);
    return setup;
  }
  if (/email_address_invalid|email.*invalid|invalid.*email/i.test(m + ' ' + code)) { console.error('[Workline] Supabase rejected the internal e-mail address (AUTH_EMAIL_DOMAIN). Detail:', m); return setup; }
  if (/signups?.*(disabled|not allowed)|signup_disabled|email_provider_disabled|provider.*disabled/i.test(m + ' ' + code)) return t('නව ලියාපදිංචි කිරීම් දැනට අක්‍රීයයි.', 'New registrations are currently disabled.');
  if (/already|registered|exists|23505/i.test(m)) return t('මෙම අංකයෙන් දැනටමත් ගිණුමක් ඇත. "පිවිසෙන්න" තෝරන්න.', 'An account with this number already exists. Choose "Sign in".');

  if (/rate|too many|429/i.test(m)) return t('උත්සාහයන් වැඩියි. මිනිත්තු කිහිපයකින් නැවත උත්සාහ කරන්න.', 'Too many attempts. Try again in a few minutes.');
  if (/network|fetch|timeout/i.test(m)) return t('අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කරන්න.', 'Check your internet connection.');

/* ---------- usage counters (once per session per row) ---------- */
function bump(table, id, field) {
  if (S.booting) return;
  const key = table + id + field;
  try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { }
  const r = S[table].find(x => x.id === id);
  if (!r || (S.me && r.owner_id === S.me.id)) return;
  r[field] = (r[field] || 0) + 1;
  DB.rpc('bump_stat', { p_table: table, p_id: id, p_field: field }).catch(() => { });
}

function readJ() {

function validJ(d, selfId) {
  if (d.title.length < 3) return t('රැකියා නාමය ඇතුළත් කරන්න', 'Enter a job title');
  if (d.company.length < 2) return t('ආයතනය / නම ඇතුළත් කරන්න', 'Enter the company / name');
  if (!d._phoneOk) return t('වලංගු දුරකථන අංකයක් ඇතුළත් කරන්න', 'Enter a valid phone number');
  if (!d.subs.length || d.subs.some(id => !TX.subs[id] || TX.subs[id].cat !== d.category)) return t('අවම වශයෙන් එක් අනු ක්ෂේත්‍රයක් තෝරන්න', 'Select at least one sub-field');
  if (d.subs.length > MAX_JOB_SUBS) return t(`උපරිම අනු ක්ෂේත්‍ර ${MAX_JOB_SUBS}ක්`, `At most ${MAX_JOB_SUBS} sub-fields`);
  if (d.district !== ISLAND && !DISTRICTS[d.district]) return t('දිස්ත්‍රික්කයක් තෝරන්න', 'Select a district');
  if (d.deadline && d.deadline < todayStr()) return t('අවසන් දිනය අතීතයේ ය', 'Deadline is in the past');
  if (S.jobs.some(j => j.id !== selfId && j.owner_id === S.me.id && j.active && norm(j.title) === norm(d.title) && j.district === d.district)) return t('එම නමින් සහ ස්ථානයෙන් ක්‍රියාත්මක රැකියාවක් දැනටමත් ඇත. එය සංස්කරණය කරන්න.', 'You already have an active job with the same title and location. Edit it instead.');
  return '';
}
const cleanJ = d => { const o = { ...d }; delete o._phoneOk; delete o._logo; delete o._ph; return o; };
async function packJobImages(d) {
  const out = { logo: d._logo ? await DB.upload('media', d._logo, 'logo-' + uid()) : '', photos: [] };
  for (const g of d._ph) out.photos.push(await DB.upload('media', g, 'jp-' + uid()));
  return out;
}
async function saveJ() {
  await run(async () => {
    const d = readJ(), err = validJ(d); if (err) return toast(err);
    if (!$('#c1').checked || !$('#c2').checked) return toast(t('නියමයන්ට එකඟ වීම අවශ්‍යයි', 'You must agree to the terms'));
    if (S.jobs.filter(j => j.owner_id === S.me.id && fmtDate(j.created_at) === todayStr()).length >= CFG.LIMITS.jobsPerDay) return toast(t('අද දින රැකියා පළ කිරීමේ සීමාව ඉක්මවා ඇත', 'Daily job posting limit reached'));
    const imgs = await packJobImages(d);
    const row = newJob({ ...cleanJ(d), ...imgs, tc: d.kind + '-' + CFG.TC_VERSION + '@' + nowIso() });
    await DB.upsert('jobs', row);
    UI.rt = ''; UI.hs = row.kind; UI.tab = 'my'; go(); postSuccess('job', row.id);
  });
}
function jed(id) {
  const j = S.jobs.find(x => x.id === id); if (!j || !isMine(j)) return;
  PHT.jl = j.logo ? [j.logo] : []; PHT.jg = (j.photos || []).slice();
  sheet(`<h2 style="margin-top:0">${t('සංස්කරණය', 'Edit')}</h2>${j.status === 'active' ? editNote() : ''}${jobForm(j)}<div class="acts" style="margin-top:18px"><button class="sec" style="flex:1" onclick="cl()">${t('අවලංගු', 'Cancel')}</button><button class="pri" style="flex:1" onclick="jupd('${id}')">${t('සුරකින්න', 'Save')}</button></div>`);
}
async function jupd(id) {
  await run(async () => {
    const j = S.jobs.find(x => x.id === id); if (!j || !isMine(j)) return;
    const d = readJ(), err = validJ(d, id); if (err) return toast(err);
    const imgs = await packJobImages(d);
    await DB.upsert('jobs', { ...j, ...cleanJ(d), ...imgs, updated_at: nowIso() });
    cl(); go(); afterEditMsg('jobs', id);
  });
}
async function tgj(id) { await run(async () => { const j = S.jobs.find(x => x.id === id); if (!j || !isMine(j)) return; await DB.upsert('jobs', { ...j, active: !j.active, updated_at: nowIso() }); toast(t('තත්ත්වය යාවත්කාලීන විය', 'Status updated')); go(); }); }
function dj(id) {
  const j = S.jobs.find(x => x.id === id); if (!j || !isMine(j)) return;
  confirmBox(t('රැකියාව මකන්නද?', 'Delete this job?'), t('අයදුම්පත් ද මැකේ. මෙය ආපසු හැරවිය නොහැක.', 'Applications are removed too. This cannot be undone.'), t('මකන්න', 'Delete'), async () => { await DB.remove('jobs', id); toast(t('මකා දමන ලදී', 'Deleted')); go(); }, true);
}

async function docUp(type, id, idx, inp) {

    const path = await DB.upload('private', d, 'doc-' + id + '-' + idx), old = S.verification_docs.find(x => x.target_id === id && x.idx === idx);

function exportMyData() {
  const me = S.me.id, out = {
    exported_at: nowIso(), account: { id: me, phone: S.me.phone },
    profile: S.workers.filter(x => x.owner_id === me), jobs: S.jobs.filter(x => x.owner_id === me),
    applications: S.applications.filter(x => x.applicant_id === me), reviews_written: S.reviews.filter(x => x.reviewer_id === me),
    payments: S.payments.filter(x => x.owner_id === me).map(p => ({ ...p, slip: p.slip ? '[stored privately]' : '' })), reports: S.reports.filter(x => x.owner_id === me),

/* ============================================================
   70 — SUPPORT PAYMENTS (manual, admin-approved)
   Posting is ALWAYS free. A voluntary maintenance contribution of
   LKR 250 / 500 / 1000 / 1500 / 2000 buys a "featured" placement for
   N days. Flow: choose plan → pay by bank deposit/transfer → submit
   slip + reference → admin checks → approved → listing is boosted
   and a numbered receipt is issued.
   Trust signals (verified badge, reviews) can NOT be bought.
   ============================================================ */
const PAY = { type: '', id: '', plan: 2 };
const payOn = () => (S.settings.general || {}).payments_enabled !== false;
const bankOf = () => S.settings.bank || {};
const bankReady = () => { const b = bankOf(); return !!(b.bank && b.acc_no && b.acc_name); };
const planOf = i => CFG.PLANS[i] || CFG.PLANS[0];
const targetOf = (type, id) => (type === 'job' ? S.jobs : S.workers).find(x => x.id === id);
const targetLabel = p => { const x = targetOf(p.target_type, p.target_id); return x ? (x.name || x.title) : (p.target_label || '—'); };
const payStatus = s => ({ pending: [t('සමාලෝචනයේ', 'In review'), '#FFA24A'], approved: [t('අනුමත', 'Approved'), 'var(--ok)'], rejected: [t('ප්‍රතික්ෂේප', 'Rejected'), '#E0486B'] }[s] || [s, '']);

function plansHtml() {
  return `<div class="plans">${CFG.PLANS.map((p, i) => `<button type="button" class="plan ${PAY.plan === i ? 'on' : ''}" onclick="selPlan(${i})" aria-pressed="${PAY.plan === i}"><b>${esc(LKRt(p.amount))}</b><span>${t(`දින ${p.days}`, `${p.days} days`)}</span></button>`).join('')}</div>`;
}
function selPlan(i) {
  PAY.plan = i; const e = $('#plans'); if (e) e.innerHTML = plansHtml();
  const s = $('#psum'); if (s) s.innerHTML = planSummary();
}
const planSummary = () => { const p = planOf(PAY.plan); return t(`${LKRt(p.amount)} → ඔබේ දැන්වීම දින ${p.days}ක් ලැයිස්තුවේ ඉහළින් පෙන්වයි.`, `${LKRt(p.amount)} → your listing is featured at the top for ${p.days} days.`); };

    PAY.type = type; PAY.id = id; PAY.plan = 2; PHT.slip = [];

    ${sim ? `<div class="box" style="padding:10px;margin:8px 0;font-size:13px;border:1px solid #FFA24A">${t('සමාන ක්ෂේත්‍රයක් ඇත', 'Similar field exists')}: <b>${esc(subName(sim.rec.id))}</b> (${esc(catName(sim.rec.cat))})</div>` : ''}
    ${p.status === 'pending' ? `<div class="acts"><button onclick="admPropApprove('${p.id}')">${t('අලුතින් එක් කරන්න', 'Add as new')}</button><button onclick="admPropMerge('${p.id}')">${t('දැනට ඇති එකකට ගළපන්න', 'Merge into existing')}</button></div><div class="acts"><button onclick="admPropNo('${p.id}')" style="color:#E0486B">${t('ප්‍රතික්ෂේප', 'Reject')}</button></div>` : (p.result_sub ? `<div class="sub">→ ${esc(subName(p.result_sub))}</div>` : '')}</div>`;

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
function subFormHtml(d) {
  return `<label for="as_c">${t('ප්‍රධාන ක්ෂේත්‍රය', 'Main field')}</label><select class="in" id="as_c">${catOptions(d.cat)}</select>

function admSubHint() {
  const names = [$('#as_si').value, $('#as_en').value].filter(x => norm(x).length >= 3), hit = names.map(n => findExact(n)).find(Boolean) || names.map(n => findSimilar(n, 0.82)).find(Boolean);
  const r = hit && (hit.rec || hit);
  $('#as_h').innerHTML = r ? `<div class="box" style="padding:10px;font-size:13px;border:1px solid #E0486B">⚠ ${t('දැනටමත් ඇත / සමානයි', 'Already exists / similar')}: <b>${esc(subName(r.id))}</b> (${esc(catName(r.cat))})</div>` : '';
}
function admAddSubForm() {
  sheet(`<h2 style="margin-top:0">${t('අනු ක්ෂේත්‍රයක් එක් කරන්න', 'Add a sub-field')}</h2>${subFormHtml({ cat: UI.cat || TX.catOrder[0], si: '', en: '', al: '' })}<button class="pri" style="margin-top:14px" onclick="admAddSub()">${t('එක් කරන්න', 'Add')}</button>`);
}
function readSub() { return { cat: $('#as_c').value, si: $('#as_si').value.trim(), en: $('#as_en').value.trim(), aliases: $('#as_al').value.split('|').map(x => x.trim()).filter(Boolean) }; }
function subCheck(d) {
  if (norm(d.si).length < 2 || norm(d.en).length < 2) return t('සිංහල සහ ඉංග්‍රීසි නම් දෙකම අවශ්‍යයි', 'Both Sinhala and English names are required');
  for (const n of [d.si, d.en, ...d.aliases]) { const x = findExact(n); if (x) return t(`"${n}" දැනටමත් "${subName(x.id)}" ලෙස ඇත`, `"${n}" already exists as "${subName(x.id)}"`); }
  const s = findSimilar(d.si, 0.85) || findSimilar(d.en, 0.85);
  if (s && !s.exact) return t(`"${subName(s.rec.id)}" සමඟ ඉතා සමානයි. එය භාවිතා කරන්න හෝ නම වෙනස් කරන්න.`, `Very similar to "${subName(s.rec.id)}". Use it or change the name.`);
  return '';
}
function uniqueSubId(en) { let b = slug(en) || 'sub', id = 'c_' + b, i = 2; while (TX.subs[id]) id = 'c_' + b + '_' + i++; return id; }
async function admAddSub() {
  await run(async () => {
    const d = readSub(), err = subCheck(d); if (err) return toast(err, 4200);
    const id = uniqueSubId(d.en);
    await DB.upsert('custom_subs', { id, category: d.cat, si: d.si, en: d.en, aliases: d.aliases, created_by: S.me.id, created_at: nowIso() });
    applyCustomSubs(); await audit('subfield_add', id, { si: d.si, en: d.en }); cl(); toast(t('එක් කළා', 'Added')); go();
  });
}

const tsOf = s => { const n = new Date(s || 0).getTime(); return isNaN(n) ? 0 : n; };

/* ---- read markers (per device) — lets the listing OWNER see which chats are new,

  const m = getRead(); if (!thId || !iso || tsOf(m[thId]) >= tsOf(iso)) return;
  m[thId] = iso; try { localStorage.setItem('wl_read', JSON.stringify(m)); } catch (e) { }
}

const myThreads = () => S.me ? S.threads.filter(x => x.owner_id === S.me.id || x.initiator_id === S.me.id) : [];

  const o = threadTarget(th);
  if (S.me && th.owner_id === S.me.id) {          /* I own the listing → the other person is the customer / applicant */
    const pw = S.workers.find(w => w.owner_id === th.initiator_id && w.status === 'active');
    return { name: pw ? pw.name : t('ගනුදෙනුකරු', 'Customer') + ' #' + shortTag(th.initiator_id), img: pw ? pw.img : '', profile: pw ? pw.id : '', phone: pw ? pw.phone : '', owner: true, listing: listingLabel(o) };
  }
  return { name: o ? (o.name || o.company || o.title) : '—', img: o ? (o.img || o.logo || '') : '', profile: th.kind === 'w' && o ? o.id : '', phone: o ? o.phone : '', owner: false, listing: listingLabel(o) };
}
const threadLast = th => CHAT.latest[th.id] || null;
function threadUnread(th) {
  const m = threadLast(th); if (!m || !S.me || m.sender_id === S.me.id) return false;
  const r = getRead()[th.id]; return !r || tsOf(m.created_at) > tsOf(r);
}
const unreadChats = () => myThreads().filter(threadUnread).length;
const listingChats = id => myThreads().filter(th => th.target_id === id && S.me && th.owner_id === S.me.id && threadLast(th)).length;
function latestFromLocal() { CHAT.latest = {}; S.messages.forEach(m => { const c = CHAT.latest[m.thread_id]; if (!c || tsOf(m.created_at) > tsOf(c.created_at)) CHAT.latest[m.thread_id] = m; }); }
function fmtWhen(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const time = d.toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'si-LK', { hour: '2-digit', minute: '2-digit' });
  return localDay(d) === todayStr() ? time : fmtDate(iso) + ' ' + time;
}

/* refresh threads + last message of every thread (cloud), so new chats appear for the owner */
async function syncInbox() {
  if (!S.me || CHAT.syncing) return;
  CHAT.syncing = true;
  try {
    if (S.mode === 'cloud') {
      await DB.reload(['threads', 'notifications']);
      const ids = myThreads().map(x => x.id);
      const l = ids.length ? await DB.latestMessages(ids) : [];
      CHAT.latest = {}; l.forEach(m => { if (!CHAT.latest[m.thread_id]) CHAT.latest[m.thread_id] = m; });
    } else latestFromLocal();
  } catch (e) { console.warn('inbox', e); }
  finally { CHAT.syncing = false; }
  renderNav();

}

/* ---------- open a chat ---------- */
function ch(kind, id) {
  needAuth(() => {
    const o = (kind === 'w' ? S.workers : S.jobs).find(x => x.id === id); if (!o) return;
    if (isMine(o)) return toast(t('මෙය ඔබේම දැන්වීමයි', 'This is your own listing'));
    let th = S.threads.find(x => x.kind === kind && x.target_id === id && x.initiator_id === S.me.id);
    /* the thread is only created when the first message is sent — so owners never see empty chats */
    if (!th) th = { id: uid(), kind, target_id: id, initiator_id: S.me.id, owner_id: o.owner_id, created_at: nowIso(), _new: true };
    openChat(th, o);
  });
}
async function openThread(id) {
  await run(async () => {
    if (!S.me) return needAuth(() => openThread(id));
    let th = S.threads.find(x => x.id === id);
    if (!th && S.mode === 'cloud') { await DB.reload(['threads']); th = S.threads.find(x => x.id === id); }
    if (!th) return toast(t('මෙම සංවාදය තවදුරටත් නැත', 'This conversation no longer exists'));
    openChat(th, threadTarget(th));
  });
}
async function ensureThread() {
  const th = CHAT.th; if (!th || !th._new) return th;
  const row = { ...th }; delete row._new;
  try { CHAT.th = await DB.upsert('threads', row); }
  catch (e) {
    if (S.mode !== 'cloud') throw e;
    await DB.reload(['threads']);
    const ex = S.threads.find(x => x.kind === th.kind && x.target_id === th.target_id && x.initiator_id === S.me.id);
    if (!ex) throw e; CHAT.th = ex;
  }
  startPoll(); return CHAT.th;
}
function startPoll() {
  clearInterval(CHAT.timer);
  if (S.mode === 'cloud' && CHAT.th && !CHAT.th._new) CHAT.timer = setInterval(() => { if (!$('#cm')) { clearInterval(CHAT.timer); return; } chatLoad(); }, 4000);
}

function chatClose() { cl(); }
async function chatLoad() {
  const th = CHAT.th; if (!th || th._new) return;
  try {
    const l = await DB.loadMessages(th.id);
    if (S.mode === 'cloud') S.messages = S.messages.filter(m => m.thread_id !== th.id).concat(l);

/* keep the brand name "Workline" in English when the browser translates the page (Chrome / Google Translate) */
const BRAND_RE = /(workline)/i;
function brandify(root) {
  if (!root || !document.createTreeWalker) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (BRAND_RE.test(n.nodeValue) && n.parentNode && !n.parentNode.closest('[translate="no"],script,style,textarea,option,title')) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => {
    const f = document.createDocumentFragment();
    n.nodeValue.split(BRAND_RE).forEach((part, i) => {
      if (!part) return;
      if (i % 2) { const sp = document.createElement('span'); sp.setAttribute('translate', 'no'); sp.className = 'notranslate'; sp.textContent = part; f.appendChild(sp); }
      else f.appendChild(document.createTextNode(part));

    n.parentNode.replaceChild(f, n);
  });
}

  brandify(document.body);
